# Training config: Quality-Aware Turn-Taking (ANCHOR + causal WavLM + TT tokens)
# Full proposed model: causal WavLM-Large + quality metrics + turn-taking tokens
# ------------------------------------------------------------------
# Architecture
# ------------------------------------------------------------------
universa: ar_universa
universa_conf:
  embedding_dim: 256

  # Audio encoder (lightweight Transformer after WavLM-Large features)
  audio_encoder_type: transformer
  audio_encoder_params:
    num_blocks: 4
    attention_heads: 4
    linear_units: 1024
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    attention_dropout_rate: 0.1
    input_layer: conv2d
    normalize_before: true
    concat_after: false
    positionwise_layer_type: linear
    positionwise_conv_kernel_size: 1
    layer_drop_rate: 0.1
    qk_norm: false
    use_flash_attn: false

  # Cross attention (no reference audio/text for turn-taking task)
  cross_attention_type: multihead
  cross_attention_params:
    n_head: 2
    dropout_rate: 0.1

  # Metric decoder
  metric_decoder_params:
    num_blocks: 12
    attention_heads: 8
    linear_units: 2048
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    src_attention_dropout_rate: 0.1
    self_attention_dropout_rate: 0.1
    input_layer: embed
    normalize_before: true
    concat_after: false
    layer_drop_rate: 0.1
    qk_norm: false
    use_flash_attn: false

  use_rope: true
  lsm_weight: 0.1
  sym_sos: "<sos>"
  sym_eos: "<eos>"

# Task-level flags (must be top-level, not inside universa_conf)
use_ref_audio: true
use_ref_text: false

# ------------------------------------------------------------------
# Frontend: Causal WavLM-Large
# ------------------------------------------------------------------
frontend: causal_s3prl
frontend_conf:
  frontend_conf:
    upstream: wavlm_large
  download_dir: ./hub
  multilayer_feature: true

# Freeze WavLM-Large weights (fine-tune only the task-specific layers)
freeze_param:
  - "frontend.upstream"

# ------------------------------------------------------------------
# Token vocabulary (quality + turn-taking)
# Generated by: local/create_turn_taking_token_list.py
# ------------------------------------------------------------------
sequential_metric: true
tokenize_numerical_metric: true
randomize_sequential_metric: true
defer_full_meta: true

metric_token_info: data/token_list/turn_taking_tokens/tokens.json

# ------------------------------------------------------------------
# Training parameters
# ------------------------------------------------------------------
max_epoch: 50
batch_type: unsorted
batch_size: 8
grad_clip: 5.0
grad_noise: false
sort_in_batch: descending
sort_batch: descending
num_workers: 4
accum_grad: 4
use_amp: true
log_interval: 50
keep_nbest_models: 5
num_att_plot: 0
seed: 777
patience: null
unused_parameters: false

# ------------------------------------------------------------------
# Optimizer & scheduler
# ------------------------------------------------------------------
optim: adamw
optim_conf:
  lr: 0.00001
  weight_decay: 0.01

scheduler: warmuplr
scheduler_conf:
  warmup_steps: 25000

# ------------------------------------------------------------------
# Init from ANCHOR quality-only checkpoint (transfer learning)
# Update this path to your trained ANCHOR model before running.
# ------------------------------------------------------------------
init_param:
  - /work/nvme/bbjs/ttao3/espnet/egs2/universa_unite/uni_versa1/exp/universa_universa_ar_overall_base_token_wavlm_large/valid.loss.best.prefix_65828.pth

ignore_init_mismatch: true   # allow head mismatch when adding TT tokens

cudnn_deterministic: false
cudnn_benchmark: false

best_model_criterion:
  - - valid
    - loss
    - min
