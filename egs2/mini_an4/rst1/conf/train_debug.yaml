# Debug config for CI: the tiny w2v-BERT 2.0 stand-in from local/data.sh,
# LoRA rank 2, one iteration.
ssl_encoder: w2v_bert2
ssl_encoder_conf:
    model_tag: downloads/tiny_w2v_bert2
    target_layer: 1
    freeze_base: true
lora_rank: 2
lora_alpha: 4
lora_dropout: 0.1
input_sr: 16000

noise_dir: data/noise_pool
rir_dir: data/rir_pool
degrade_prob: 0.5
online_degradation: true
max_duration: 4.0

optim: adamw
optim_conf:
    lr: 1.0e-4
scheduler: null

max_epoch: 1
num_iters_per_epoch: 1
batch_type: unsorted
batch_size: 2
valid_batch_size: 2
accum_grad: 1
grad_clip: 1.0
num_workers: 0
seed: 42
best_model_criterion:
    -   - valid
        - loss
        - min
keep_nbest_models: 1
log_interval: 1
use_amp: false
num_att_plot: 0
